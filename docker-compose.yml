name: nexo

# ============================================================================
# Definición base de los tres servicios.
#
# `docker-compose.override.yml` se aplica automáticamente encima y agrega lo
# propio de desarrollo (puertos publicados, bind mounts, hot-reload).
# Para levantar SOLO esta definición (modo producción):
#
#   docker compose -f docker-compose.yml up
# ============================================================================

services:
  # ── Base de datos ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nexo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexo

  # ── Backend (NestJS) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./Nexo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # La app no las lee: son para `docker compose exec backend npm run
      # prisma:seed`. Sin pasarlas, definir ADMIN_PASSWORD en el .env no
      # tendría ningún efecto al sembrar dentro del contenedor.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Sin template literals: compose interpolaría el ${...} antes que node.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.PORT + '/api/health')
          .then(r => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexo

  # ── Frontend (Reflex) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Nexo-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:3001/api}
    ports:
      # UI — lo que abre el navegador
      - "${FRONTEND_PORT:-3000}:3000"
      # Backend propio de Reflex (websocket de estado). El navegador se conecta
      # directo acá, así que tiene que estar publicado.
      - "${REFLEX_BACKEND_PORT:-8000}:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request, sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000', timeout=5).status == 200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - nexo

volumes:
  nexo_pgdata:

networks:
  nexo:
    driver: bridge
